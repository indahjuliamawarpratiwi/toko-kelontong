{% extends "base.html" %}
{% block content %}
<div class="flex flex-wrap justify-between items-center mb-6 gap-4">
    <div>
        <h2 class="text-2xl font-bold text-gray-800">Laporan Penjualan & Keuangan</h2>
        <p class="text-sm text-gray-500">Pantau perputaran omset kasir dan rincian produk yang paling laris terjual.</p>
    </div>
    <div class="bg-white border border-gray-200 rounded-xl p-1 flex shadow-sm">
        <button onclick="loadLaporan('harian')" id="btn-harian" class="px-4 py-2 text-xs font-semibold rounded-lg filter-btn bg-primary text-white cursor-pointer">Hari Ini</button>
        <button onclick="loadLaporan('mingguan')" id="btn-mingguan" class="px-4 py-2 text-xs font-semibold rounded-lg filter-btn text-gray-600 hover:bg-gray-100 cursor-pointer">7 Hari Terakhir</button>
        <button onclick="loadLaporan('bulanan')" id="btn-bulanan" class="px-4 py-2 text-xs font-semibold rounded-lg filter-btn text-gray-600 hover:bg-gray-100 cursor-pointer">30 Hari Terakhir</button>
    </div>
</div>

<div class="bg-emerald-50 border border-emerald-100 rounded-xl p-4 mb-6 flex items-center justify-between">
    <div class="flex items-center space-x-3">
        <div class="w-10 h-10 rounded-full bg-emerald-600 text-white flex items-center justify-center text-lg shadow-sm">
            <i class="fa-solid fa-money-bill-wave"></i>
        </div>
        <div>
            <p class="text-[11px] font-bold text-emerald-800 uppercase tracking-wider">Total Omset Pendapatan Terfilter</p>
            <h3 id="rekap-total-omset" class="text-2xl font-extrabold text-emerald-700 mt-0.5">Rp 0</h3>
        </div>
    </div>
</div>

<div class="bg-white rounded-xl shadow-sm overflow-hidden">
    <div class="overflow-x-auto">
        <table class="w-full border-collapse text-left text-sm">
            <thead class="bg-gray-50 text-gray-600 font-semibold text-xs border-b uppercase tracking-wider">
                <tr>
                    <th class="p-4">Waktu Transaksi</th>
                    <th class="p-4">Nama Barang Terjual</th>
                    <th class="p-4">Jumlah Qty</th>
                    <th class="p-4">Subtotal Omset</th>
                </tr>
            </thead>
            <tbody id="tabel-laporan-body" class="divide-y text-gray-700 text-xs">
                </tbody>
        </table>
    </div>
</div>

<script>
    function loadLaporan(filter) {
        // Logika pewarnaan tombol filter aktif
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.classList.remove('bg-primary', 'text-white');
            btn.classList.add('text-gray-600', 'hover:bg-gray-100');
        });
        const activeBtn = document.getElementById(`btn-${filter}`);
        activeBtn.classList.add('bg-primary', 'text-white');
        activeBtn.classList.remove('text-gray-600', 'hover:bg-gray-100');

        // Tarik data dari API laporan keuangan
        fetch(`/api/laporan?filter=${filter}`)
            .then(res => res.json())
            .then(data => {
                const tbody = document.getElementById('tabel-laporan-body');
                tbody.innerHTML = '';
                
                let grandTotalOmset = 0;

                if(data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="4" class="text-center py-8 text-gray-400 font-medium">Tidak ada rekaman data transaksi penjualan pada rentang periode ini.</td></tr>';
                    document.getElementById('rekap-total-omset').innerText = "Rp 0";
                    return;
                }
                
                data.forEach(item => {
                    grandTotalOmset += item.total_pendapatan;
                    tbody.innerHTML += `
                        <tr class="hover:bg-gray-50 transition">
                            <td class="p-4 text-gray-400 font-mono">${item.tanggal}</td>
                            <td class="p-4 font-bold text-gray-800">${item.nama_barang}</td>
                            <td class="p-4 font-mono text-gray-600 font-semibold">${item.jumlah}</td>
                            <td class="p-4 font-bold text-emerald-700">Rp ${item.total_pendapatan.toLocaleString()}</td>
                        </tr>
                    `;
                });

                // Perbarui total rekap omset di banner atas
                document.getElementById('rekap-total-omset').innerText = `Rp ${grandTotalOmset.toLocaleString()}`;
            });
    }

    // Jalankan otomatis default filter harian saat pertama dibuka
    document.addEventListener("DOMContentLoaded", () => loadLaporan('harian'));
</script>
{% endblock %}

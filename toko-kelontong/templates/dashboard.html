{% extends "base.html" %}
{% block content %}

<div class="mb-6">
    <h2 class="text-2xl font-bold text-gray-800">Dashboard Ringkasan Toko</h2>
    <p class="text-sm text-gray-500">Selamat datang! Berikut adalah ringkasan data toko kelontong Anda hari ini.</p>
</div>

<div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
    <div class="bg-white p-6 rounded-xl shadow-sm border-l-4 border-blue-600 flex items-center justify-between">
        <div>
            <p class="text-xs font-bold text-gray-400 uppercase tracking-wider">Total Jenis Barang</p>
            <h3 id="stat-jenis" class="text-3xl font-extrabold text-gray-800 mt-1">0</h3>
        </div>
        <div class="w-12 h-12 rounded-full bg-blue-50 flex items-center justify-center">
            <i class="fa-solid fa-box text-xl text-blue-600"></i>
        </div>
    </div>
    
    <div class="bg-white p-6 rounded-xl shadow-sm border-l-4 border-emerald-500 flex items-center justify-between">
        <div>
            <p class="text-xs font-bold text-gray-400 uppercase tracking-wider">Total Stok Produk</p>
            <h3 id="stat-stok" class="text-3xl font-extrabold text-gray-800 mt-1">0</h3>
        </div>
        <div class="w-12 h-12 rounded-full bg-emerald-50 flex items-center justify-center">
            <i class="fa-solid fa-boxes-stacked text-xl text-emerald-500"></i>
        </div>
    </div>
    
    <div class="bg-white p-6 rounded-xl shadow-sm border-l-4 border-amber-500 flex items-center justify-between">
        <div>
            <p class="text-xs font-bold text-gray-400 uppercase tracking-wider">Transaksi Hari Ini</p>
            <h3 id="stat-tx" class="text-3xl font-extrabold text-gray-800 mt-1">0</h3>
        </div>
        <div class="w-12 h-12 rounded-full bg-amber-50 flex items-center justify-center">
            <i class="fa-solid fa-receipt text-xl text-amber-500"></i>
        </div>
    </div>
</div>

<div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
    <div class="bg-white p-6 rounded-xl shadow-sm lg:col-span-2">
        <h3 class="text-base font-bold text-gray-800 mb-4"><i class="fa-solid fa-chart-line mr-2 text-blue-600"></i>Grafik Omset Penjualan</h3>
        <div class="relative w-full h-64 flex items-center justify-center bg-gray-50 rounded-lg border border-dashed">
            <canvas id="salesChart"></canvas>
        </div>
    </div>
    
    <div class="bg-white p-6 rounded-xl shadow-sm">
        <h3 class="text-base font-bold text-gray-800 mb-4"><i class="fa-solid fa-circle-exclamation mr-2 text-red-500"></i>Peringatan Stok Menipis</h3>
        <div id="container-menipis" class="space-y-3">
            </div>
    </div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        // Panggil API statistik dashboard
        fetch('/api/dashboard')
            .then(res => res.json())
            .then(data => {
                // Tampilkan ke kartu atas
                document.getElementById('stat-jenis').innerText = data.total_jenis || 0;
                document.getElementById('stat-stok').innerText = data.total_stok || 0;
                document.getElementById('stat-tx').innerText = data.transaksi_hari_ini || 0;
                
                // Tampilkan notifikasi stok menipis
                const container = document.getElementById('container-menipis');
                if (!data.stok_menipis || data.stok_menipis.length === 0) {
                    container.innerHTML = '<p class="text-gray-400 text-sm text-center py-4">Semua stok aman dan penuh!</p>';
                } else {
                    container.innerHTML = '';
                    data.stok_menipis.forEach(item => {
                        container.innerHTML += `
                            <div class="flex justify-between items-center bg-red-50 border border-red-100 p-3 rounded-lg">
                                <div>
                                    <h4 class="font-bold text-gray-800 text-xs">${item.nama_barang}</h4>
                                    <p class="text-[11px] text-gray-500">Sisa Stok: <span class="text-red-600 font-bold">${item.stok}</span> ${item.satuan}</p>
                                </div>
                                <span class="bg-red-600 text-white text-[9px] px-2 py-0.5 rounded-md font-bold uppercase">Stok Menipis</span>
                            </div>
                        `;
                    });
                }

                // Render Grafik Chart.js dengan pengaman data kosong
                const ctx = document.getElementById('salesChart').getContext('2d');
                let labels = ['Belum Ada Transaksi'];
                let values = [0];

                if(data.grafik && data.grafik.labels && data.grafik.labels.length > 0) {
                    labels = data.grafik.labels;
                    values = data.grafik.values;
                }

                new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: labels,
                        datasets: [{
                            label: 'Pendapatan (Rp)',
                            data: values,
                            borderColor: '#1E3A8A',
                            backgroundColor: 'rgba(30, 58, 138, 0.05)',
                            fill: true,
                            tension: 0.2
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false
                    }
                });
            })
            .catch(err => {
                console.error("Terjadi error: ", err);
            });
    });
</script>

{% endblock %}

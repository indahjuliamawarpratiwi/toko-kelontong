{% extends "base.html" %}
{% block content %}
<div class="mb-6">
    <h2 class="text-2xl font-bold text-gray-800">Restok Inventaris Barang</h2>
    <p class="text-sm text-gray-500">Tambah jumlah stok produk langsung dari supplier dan pantau riwayat log masuk gudang.</p>
</div>

<div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
    <div class="bg-white p-6 rounded-xl shadow-sm h-fit">
        <h3 class="text-base font-bold text-gray-800 mb-4"><i class="fa-solid fa-truck-moving mr-2 text-primary"></i>Input Stok Masuk</h3>
        <form onsubmit="simpanRestok(event)" class="space-y-4">
            <div>
                <label class="block text-xs font-bold text-gray-600 uppercase mb-1">Pilih Produk</label>
                <select id="restok-barang" required class="w-full border border-gray-300 p-2 rounded-lg bg-white focus:outline-none focus:border-blue-700 text-sm">
                    </select>
            </div>
            <div>
                <label class="block text-xs font-bold text-gray-600 uppercase mb-1">Jumlah Tambahan Masuk</label>
                <input type="number" id="restok-jumlah" min="1" required class="w-full border border-gray-300 p-2 rounded-lg focus:outline-none focus:border-blue-700 text-sm" placeholder="Contoh: 50">
            </div>
            <button type="submit" class="w-full bg-primary hover:bg-blue-800 text-white p-2.5 rounded-lg font-semibold text-sm transition shadow-sm cursor-pointer">
                <i class="fa-solid fa-circle-plus mr-2"></i>Konfirmasi Masuk Gudang
            </button>
        </form>
    </div>

    <div class="bg-white p-6 rounded-xl shadow-sm lg:col-span-2">
        <h3 class="text-base font-bold text-gray-800 mb-4"><i class="fa-solid fa-clock-rotate-left mr-2 text-blue-600"></i>Log Riwayat Restok Masuk</h3>
        <div class="overflow-x-auto">
            <table class="w-full text-left text-sm border-collapse">
                <thead class="bg-gray-50 text-gray-600 font-semibold text-xs border-b border-gray-200 uppercase tracking-wider">
                    <tr>
                        <th class="p-3">ID Log</th>
                        <th class="p-3">Nama Barang</th>
                        <th class="p-3">Jumlah Ditambah</th>
                        <th class="p-3">Tanggal Masuk</th>
                    </tr>
                </thead>
                <tbody id="tabel-restok-body" class="divide-y divide-gray-100 text-gray-700 text-xs">
                    </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    function initRestokPage() {
        // Ambil opsi daftar barang untuk menu dropdown
        fetch('/api/barang')
            .then(res => res.json())
            .then(data => {
                const select = document.getElementById('restok-barang');
                select.innerHTML = '<option value="" disabled selected>-- Pilih Produk Dagang --</option>';
                data.forEach(b => {
                    select.innerHTML += `<option value="${b.id_barang}">${b.nama_barang} (Gudang: ${b.stok} ${b.satuan})</option>`;
                });
            });

        // Ambil log riwayat restok
        fetch('/api/restok')
            .then(res => res.json())
            .then(data => {
                const tbody = document.getElementById('tabel-restok-body');
                tbody.innerHTML = '';
                if(data.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="4" class="text-center py-6 text-gray-400">Belum ada riwayat restok masuk gudang.</td></tr>`;
                    return;
                }
                data.forEach(r => {
                    tbody.innerHTML += `
                        <tr class="hover:bg-gray-50">
                            <td class="p-3 font-mono text-gray-400">#RST-${r.id_restok}</td>
                            <td class="p-3 font-semibold text-gray-800">${r.nama_barang}</td>
                            <td class="p-3 font-bold text-blue-600">+ ${r.jumlah_tambah}</td>
                            <td class="p-3 text-gray-500">${r.tanggal}</td>
                        </tr>
                    `;
                });
            });
    }

    function simpanRestok(e) {
        e.preventDefault();
        const payload = {
            id_barang: parseInt(document.getElementById('restok-barang').value),
            jumlah_tambah: parseInt(document.getElementById('restok-jumlah').value)
        };

        fetch('/api/restok', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(payload)
        }).then(res => res.json()).then(res => {
            if(res.error) alert(res.error);
            else {
                alert("Stok gudang berhasil ditambahkan!");
                document.getElementById('restok-jumlah').value = '';
                initRestokPage();
            }
        });
    }

    document.addEventListener("DOMContentLoaded", initRestokPage);
</script>
{% endblock %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Kasir Kelontong Modern</title>
    
    <link href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <style>
        /* Memastikan warna biru tua kustom sesuai spesifikasi tetap berjalan */
        .bg-primary { background-color: #1E3A8A !important; }
        .text-primary { color: #1E3A8A !important; }
        .hover\:bg-blue-800:hover { background-color: #1e40af !important; }
    </style>
</head>
<body class="bg-gray-100 font-sans">
    <div class="flex h-screen overflow-hidden">
        
        <div class="w-64 bg-primary text-white flex flex-col justify-between hidden md:flex">
            <div class="p-5">
                <h1 class="text-2xl font-bold tracking-wider mb-8"><i class="fa-solid fa-shop mr-2"></i>Toko Kita</h1>
                <nav class="space-y-2">
                    <a href="/" class="flex items-center p-3 hover:bg-blue-800 rounded-lg transition"><i class="fa-solid fa-chart-pie w-8"></i> Dashboard</a>
                    <a href="/barang" class="flex items-center p-3 hover:bg-blue-800 rounded-lg transition"><i class="fa-solid fa-box w-8"></i> Stok Barang</a>
                    <a href="/kasir" class="flex items-center p-3 hover:bg-blue-800 rounded-lg transition"><i class="fa-solid fa-cash-register w-8"></i> Kasir Transaksi</a>
                    <a href="/restok" class="flex items-center p-3 hover:bg-blue-800 rounded-lg transition"><i class="fa-solid fa-truck-ramp-box w-8"></i> Restok Barang</a>
                    <a href="/laporan" class="flex items-center p-3 hover:bg-blue-800 rounded-lg transition"><i class="fa-solid fa-file-invoice-dollar w-8"></i> Laporan Keuangan</a>
                </nav>
            </div>
            <div class="p-5 border-t border-blue-800 text-sm opacity-75">v1.0 - Admin Panel</div>
        </div>

        <div class="flex-1 flex flex-col overflow-y-auto">
            <header class="bg-white shadow px-6 py-4 flex justify-between items-center">
                <div class="font-semibold text-gray-700 text-lg">Aplikasi Manajemen Toko Kelontong</div>
                <div class="flex items-center space-x-3">
                    <div class="w-8 h-8 rounded-full bg-primary text-white flex items-center justify-center font-bold">A</div>
                    <span class="text-gray-600 font-medium hidden sm:inline">Administrator</span>
                </div>
            </header>

            <main class="p-6">
                {% block content %}{% endblock %}
            </main>
        </div>
    </div>
</body>
</html>

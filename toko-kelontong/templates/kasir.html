{% extends "base.html" %}
{% block content %}
<div class="mb-6">
    <h2 class="text-2xl font-bold text-gray-800">Mesin Kasir Penjualan</h2>
    <p class="text-sm text-gray-500">Pilih produk, atur kuantitas, dan proses transaksi belanja pelanggan dengan cepat.</p>
</div>

<div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
    <div class="bg-white p-6 rounded-xl shadow-sm lg:col-span-2">
        <h3 class="text-base font-bold text-gray-800 mb-4"><i class="fa-solid fa-boxes-stacked mr-2 text-primary"></i>Katalog Produk Tersedia</h3>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4" id="daftar-barang-kasir">
            </div>
    </div>

    <div class="bg-white p-6 rounded-xl shadow-sm flex flex-col justify-between h-fit sticky top-6">
        <div>
            <h3 class="text-base font-bold text-gray-800 mb-4"><i class="fa-solid fa-cart-shopping mr-2 text-emerald-600"></i>Keranjang Belanja</h3>
            <div id="keranjang-list" class="divide-y divide-gray-100 max-h-80 overflow-y-auto mb-4 pr-1">
                <p class="text-gray-400 text-sm text-center py-8">Keranjang belanja kosong.</p>
            </div>
        </div>
        <div class="border-t pt-4">
            <div class="flex justify-between items-center text-lg font-bold text-gray-800 mb-4">
                <span>Total Bayar:</span>
                <span id="grand-total" class="text-emerald-700">Rp 0</span>
            </div>
            <button onclick="prosesCheckout()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white p-3 rounded-xl font-bold tracking-wide shadow transition cursor-pointer">
                <i class="fa-solid fa-circle-check mr-2"></i>Selesaikan Transaksi
            </button>
        </div>
    </div>
</div>

<script>
    let semuaBarang = [];
    let keranjang = [];

    function loadBarangKasir() {
        fetch('/api/barang')
            .then(res => res.json())
            .then(data => {
                semuaBarang = data;
                const container = document.getElementById('daftar-barang-kasir');
                container.innerHTML = '';
                
                if(data.length === 0) {
                    container.innerHTML = '<p class="text-gray-400 text-sm col-span-2 text-center py-6">Belum ada barang di gudang. Silakan tambah barang dahulu di menu Stok Barang.</p>';
                    return;
                }

                data.forEach(b => {
                    const outOfStock = b.stok <= 0;
                    container.innerHTML += `
                        <div class="border border-gray-100 p-4 rounded-xl flex justify-between items-center bg-gray-50 hover:bg-gray-100/70 transition ${outOfStock ? 'opacity-50' : ''}">
                            <div>
                                <h4 class="font-bold text-gray-800 text-sm">${b.nama_barang}</h4>
                                <p class="text-[11px] text-gray-500">Stok: ${b.stok} ${b.satuan} | Kategori: ${b.kategori || '-'}</p>
                                <p class="text-sm font-bold text-emerald-700 mt-1">Rp ${b.harga_jual.toLocaleString()}</p>
                            </div>
                            <button onclick="tambahKeKeranjang(${b.id_barang})" ${outOfStock ? 'disabled' : ''} class="bg-primary hover:bg-blue-800 text-white px-3 py-1.5 rounded-lg text-xs font-semibold shadow-sm transition cursor-pointer disabled:bg-gray-400 disabled:cursor-not-allowed">
                                ${outOfStock ? 'Habis' : '<i class="fa-solid fa-plus mr-1"></i> Pilih'}
                            </button>
                        </div>
                    `;
                });
            });
    }

    function tambahKeKeranjang(id) {
        const barang = semuaBarang.find(b => b.id_barang === id);
        const itemDiKeranjang = keranjang.find(item => item.id_barang === id);

        if (itemDiKeranjang) {
            if (itemDiKeranjang.jumlah >= barang.stok) {
                alert(`Stok tidak mencukupi! Sisa stok ${barang.nama_barang} hanya ${barang.stok} ${barang.satuan}`);
                return;
            }
            itemDiKeranjang.jumlah++;
        } else {
            keranjang.push({ ...barang, jumlah: 1 });
        }
        renderKeranjang();
    }

    function ubahJumlahItem(id, nilai) {
        const item = keranjang.find(i => i.id_barang === id);
        const barang = semuaBarang.find(b => b.id_barang === id);
        
        if(item) {
            item.jumlah += nilai;
            if(item.jumlah > barang.stok) {
                alert(`Stok tidak mencukupi! Batas maksimum adalah ${barang.stok}`);
                item.jumlah = barang.stok;
            }
            if(item.jumlah <= 0) {
                keranjang = keranjang.filter(i => i.id_barang !== id);
            }
            renderKeranjang();
        }
    }

    function renderKeranjang() {
        const list = document.getElementById('keranjang-list');
        if (keranjang.length === 0) {
            list.innerHTML = '<p class="text-gray-400 text-sm text-center py-8">Keranjang belanja kosong.</p>';
            document.getElementById('grand-total').innerText = 'Rp 0';
            return;
        }

        list.innerHTML = '';
        let gTotal = 0;
        keranjang.forEach(item => {
            const subtotal = item.harga_jual * item.jumlah;
            gTotal += subtotal;
            list.innerHTML += `
                <div class="py-3 flex justify-between items-center text-xs">
                    <div>
                        <h5 class="font-bold text-gray-800">${item.nama_barang}</h5>
                        <p class="text-[10px] text-gray-400">@ Rp ${item.harga_jual.toLocaleString()}</p>
                    </div>
                    <div class="flex items-center space-x-2">
                        <div class="flex items-center border rounded-md bg-white border-gray-300">
                            <button onclick="ubahJumlahItem(${item.id_barang}, -1)" class="px-1.5 py-0.5 hover:bg-gray-100 font-bold cursor-pointer">-</button>
                            <span class="px-2 font-mono font-bold text-gray-800">${item.jumlah}</span>
                            <button onclick="ubahZoomItem = ubahJumlahItem(${item.id_barang}, 1)" class="px-1.5 py-0.5 hover:bg-gray-100 font-bold cursor-pointer">+</button>
                        </div>
                        <span class="font-bold text-gray-700 min-w-[65px] text-right">Rp ${subtotal.toLocaleString()}</span>
                    </div>
                </div>
            `;
        });
        document.getElementById('grand-total').innerText = `Rp ${gTotal.toLocaleString()}`;
    }

    function prosesCheckout() {
        if(keranjang.length === 0) return alert("Pilih produk ke dalam keranjang terlebih dahulu!");
        
        const payload = keranjang.map(i => ({ id_barang: i.id_barang, jumlah: i.jumlah }));
        
        fetch('/api/penjualan', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(payload)
        }).then(res => res.json()).then(res => {
            if (res.error) {
                alert("Transaksi Gagal: " + res.error);
            } else {
                alert("Transaksi Berhasil Diproses! Stok otomatis berkurang.");
                keranjang = [];
                renderKeranjang();
                loadBarangKasir();
            }
        });
    }

    document.addEventListener("DOMContentLoaded", loadBarangKasir);
</script>
{% endblock %}
